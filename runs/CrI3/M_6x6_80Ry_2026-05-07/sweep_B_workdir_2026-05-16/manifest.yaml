purpose: |
  80 Ry production-scale bispinor IBZ end-to-end gate, full-BZ leg.
  Pair partner: ../0Y_lorrax_bispinor_ibz_16gpu_2026-05-16.
  Cleared the 30 Ry gate at 51 µeV; this validates the same fixes
  (band-pad / band_chunk floor / μ-pad / scope drop) hold at 80 Ry
  scale (n_rmu=1508, nband=150) and exposes any remaining scale-only
  cascade bugs.  Uses transverse centroids generated 2026-05-16 via
  centroid.kmeans_cli --density-mode current --seed 42 (orbit-aware
  default for ntran=6).

# LORRAX cohsex
