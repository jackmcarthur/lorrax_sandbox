  x_only: true
  do_screened: false
  screening: cohsex
  memory_per_device_gb: 70.0
  band_chunk_size: 16
  r_chunk_size: 8192
  bare_coulomb_cutoff: 80.0
  ngpu_per_node: 4
  nodes: 4
  total_gpus: 16
  source_branch: agent/bispinor-ibz
  source_commit: d96aa46
