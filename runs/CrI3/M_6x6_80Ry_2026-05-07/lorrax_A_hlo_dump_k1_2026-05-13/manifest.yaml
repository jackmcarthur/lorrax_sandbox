run_id: cri3_hlo_dump_k1_2026-05-13
variant_of: cri3_hlo_dump_2026-05-13
overrides: { psig_k_chunk_size: 1, memory_per_device_gb: 35.0 }
purpose: |
  Second HLO dump under the just-committed band_fft_unsharded term. At
  psig_k_chunk_size=1 the band-FFT pool predicts 1/6 the original size
  (~33 GB on this geometry), should fit in 35 GB budget. Validates:
  (a) the linear-in-psig_k_chunk_size claim, (b) slot count stays at
  ~58 per N_BC (band_chunk-independent in COUNT), (c) per-slot bytes
  drop 6x to ~0.54 GiB. If the run completes the fit_zeta loop
  end-to-end, the planner's accounting is honest at this geometry.
